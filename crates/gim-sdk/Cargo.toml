[package]
name = "gim-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `testing::{FakeTransport, MemorySecretStorage}`.
testing = ["dep:gim-test"]

[dependencies]
async-trait.workspace = true
gim-base.workspace = true
gim-common.workspace = true
gim-crypto.workspace = true
gim-proto.workspace = true
gim-test = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
gim-sdk = { path = ".", features = ["testing"] }
gim-test.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
