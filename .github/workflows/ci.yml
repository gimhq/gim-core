name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      # Debug info for the SQLCipher + vendored OpenSSL workspace does not
      # fit on the runner disk; tests and clippy do not need it.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune --all --force > /dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Disk usage after tests
        if: always()
        run: df -h /
      - name: Swift bindings smoke
        run: bash scripts/generate-swift.sh
      - name: Committed bindings in sync
        run: |
          bash scripts/generate-bindings.sh
          git diff --exit-code -- bindings/gim-ffi/generated
          untracked=$(git status --porcelain -- bindings/gim-ffi/generated)
          if [ -n "$untracked" ]; then
            echo "Generated bindings out of date:"
            echo "$untracked"
            exit 1
          fi

  xcframework:
    needs: rust
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build GIMCore.xcframework
        run: bash scripts/build-xcframework.sh
      - name: Check GIMCore.xcframework size
        run: |
          du -sh out/ios/GIMCore.xcframework/*/
          find out/ios/GIMCore.xcframework -name '*.a' -exec ls -l {} +
          size=$(stat -f %z out/ios/GIMCore.xcframework.zip)
          echo "GIMCore.xcframework.zip: $size bytes"
          limit=50000000
          if [ "$size" -ge "$limit" ]; then
            echo "error: GIMCore.xcframework.zip is $size bytes (limit $limit)"
            exit 1
          fi
      - name: Link-test GIMCore.xcframework
        run: |
          xcf=out/ios/GIMCore.xcframework
          fail=0
          for slice in ios-arm64:iphoneos:arm64-apple-ios18.0 \
                       ios-arm64-simulator:iphonesimulator:arm64-apple-ios18.0-simulator; do
            IFS=: read -r dir sdk triple <<< "$slice"
            lib=$xcf/$dir/libgim_core.a
            # An app executable, and a relocatable link of every member as
            # SwiftPM does when it links a package target.
            for kind in executable relocatable; do
              if [ "$kind" = executable ]; then
                args=(bindings/apple/link-test/main.c "$lib"
                      -framework Security -framework SystemConfiguration
                      -framework CoreFoundation -lc++ -lresolv
                      -o "$RUNNER_TEMP/link-test-$dir")
              else
                args=(-nostdlib -Xlinker -r -Xlinker -all_load "$lib"
                      -o "$RUNNER_TEMP/GIMCore-$dir.o")
              fi
              log=$RUNNER_TEMP/link-$kind-$dir.log
              status=0
              xcrun --sdk "$sdk" clang -target "$triple" -I "$xcf/$dir/Headers" \
                "${args[@]}" > "$log" 2>&1 || status=$?
              cat "$log"
              if [ "$status" -ne 0 ] || grep -q 'Assertion failed' "$log"; then
                echo "error: $kind link of $dir failed (exit $status)"
                fail=1
              else
                echo "$kind link of $dir: ok"
              fi
            done
          done
          exit "$fail"
      - uses: actions/upload-artifact@v4
        with:
          name: gim-core-ios-${{ github.sha }}
          if-no-files-found: error
          path: |
            out/ios/GIMCore.xcframework.zip
            out/ios/GIMCore.xcframework.zip.sha256
            out/ios/Sources/**
            out/ios/GIM_CORE_VERSION
