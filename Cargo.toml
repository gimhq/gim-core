[workspace]
resolver = "2"
members = [
    "crates/gim-common",
    "crates/gim-proto",
    "crates/gim-crypto",
    "crates/gim-base",
    "crates/gim-sqlite",
    "crates/gim-sdk",
    "crates/gim-ui",
    "bindings/gim-ffi",
    "uniffi-bindgen",
    "testing/gim-test",
    "testing/gim-integration-testing",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
gim-common = { path = "crates/gim-common" }
gim-proto = { path = "crates/gim-proto" }
gim-crypto = { path = "crates/gim-crypto" }
gim-base = { path = "crates/gim-base" }
gim-sqlite = { path = "crates/gim-sqlite" }
gim-sdk = { path = "crates/gim-sdk" }
gim-ui = { path = "crates/gim-ui" }
gim-test = { path = "testing/gim-test" }

aes-gcm = "=0.10.3"
async-trait = "=0.1.92"
base64 = "=0.22.1"
ciborium = "=0.2.2"
getrandom = "=0.2.17"
openmls = "=0.9.1"
openmls_basic_credential = "=0.6.0"
openmls_memory_storage = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"
openmls_traits = "=0.6.0"
# rustls with the ring provider and webpki roots: no aws-lc/cmake/OpenSSL in
# Android/iOS cross-compiles.
reqwest = { version = "=0.12.28", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
    "stream",
] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = "=1.53.1"
tokio-util = { version = "=0.7.18", default-features = false, features = ["io"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
uniffi = "=0.32.2"
url = "=2.5.8"
wiremock = "=0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
