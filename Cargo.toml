[workspace]
resolver = "2"
members = [
    "crates/gim-common",
    "crates/gim-proto",
    "crates/gim-crypto",
    "crates/gim-base",
    "crates/gim-sqlite",
    "crates/gim-sdk",
    "crates/gim-ui",
    "bindings/gim-ffi",
    "uniffi-bindgen",
    "testing/gim-test",
    "testing/gim-integration-testing",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
gim-common = { path = "crates/gim-common" }
gim-proto = { path = "crates/gim-proto" }
gim-crypto = { path = "crates/gim-crypto" }
gim-base = { path = "crates/gim-base" }
gim-sqlite = { path = "crates/gim-sqlite" }
gim-sdk = { path = "crates/gim-sdk" }
gim-ui = { path = "crates/gim-ui" }
gim-test = { path = "testing/gim-test" }

openmls = "=0.9.1"
openmls_basic_credential = "=0.6.0"
openmls_memory_storage = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
uniffi = "=0.32.2"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
