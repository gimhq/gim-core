[workspace]
resolver = "2"
members = [
    "crates/gim-common",
    "crates/gim-proto",
    "crates/gim-crypto",
    "crates/gim-identity",
    "crates/gim-base",
    "testing/gim-test",
]
# Moved to gim-client-sdk; kept here only until they are deleted.
exclude = [
    "crates/gim-sdk",
    "crates/gim-ui",
    "crates/gim-sqlite",
    "bindings/gim-ffi",
    "apps/gim-cli",
    "uniffi-bindgen",
    "testing/gim-integration-testing",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
gim-common = { path = "crates/gim-common" }
gim-proto = { path = "crates/gim-proto" }
gim-crypto = { path = "crates/gim-crypto" }
gim-identity = { path = "crates/gim-identity" }
gim-base = { path = "crates/gim-base" }
gim-test = { path = "testing/gim-test" }

aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
base64 = "=0.22.1"
ciborium = "=0.2.2"
data-encoding = "=2.11.1"
ed25519-dalek = "=2.2.0"
getrandom = "=0.2.17"
hkdf = "=0.12.4"
openmls = "=0.9.1"
openmls_memory_storage = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.21"
web-time = "=1.1.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = { version = "=1.9.1", features = ["derive"] }

# Recovery backups run Argon2id with 64 MiB; unoptimized it dominates
# debug test runs.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

